{% extends "base.html" %}

{% block title %}Login - PCB Vision{% endblock %}

{% block content %}
<div class="auth-background" id="auth-background">
    <!-- Animated Particles -->
    <div class="particle" style="top: 10%; left: 10%; width: 4px; height: 4px;"></div>
    <div class="particle" style="top: 20%; left: 80%; width: 6px; height: 6px;"></div>
    <div class="particle" style="top: 60%; left: 20%; width: 3px; height: 3px;"></div>
    <div class="particle" style="top: 70%; left: 70%; width: 5px; height: 5px;"></div>
    <div class="particle" style="top: 40%; left: 50%; width: 4px; height: 4px;"></div>
    <div class="particle" style="top: 80%; left: 30%; width: 3px; height: 3px;"></div>
    <div class="particle" style="top: 30%; left: 90%; width: 5px; height: 5px;"></div>
    <div class="particle" style="top: 50%; left: 10%; width: 4px; height: 4px;"></div>
</div>

<div class="auth-container">
    <div class="auth-card">
        <!-- Logo Section -->
        <div class="auth-logo">
            <div class="auth-logo-icon">
                <i class="fas fa-microchip"></i>
            </div>
            <h1>PCB Vision</h1>
            <p class="auth-subtitle">AI-Powered PCB Defect Detection</p>
        </div>

        <!-- Welcome Section -->
        <div class="auth-welcome">
            <h2>Welcome Back</h2>
            <p>Sign in to access your dashboard</p>
        </div>

        <!-- Login Form -->
        <form class="auth-form" id="login-form" onsubmit="handleLogin(event)">
            <div class="form-group">
                <label for="login-email">Email Address</label>
                <div class="input-wrapper">
                    <i class="fas fa-envelope input-icon"></i>
                    <input
                        type="email"
                        id="login-email"
                        name="email"
                        placeholder="Enter your email"
                        required
                        autocomplete="email"
                    >
                </div>
            </div>

            <div class="form-group">
                <label for="login-password">Password</label>
                <div class="input-wrapper">
                    <i class="fas fa-lock input-icon"></i>
                    <input
                        type="password"
                        id="login-password"
                        name="password"
                        placeholder="Enter your password"
                        required
                        autocomplete="current-password"
                    >
                    <button type="button" class="password-toggle" onclick="togglePassword('login-password')">
                        <i class="fas fa-eye" id="login-password-icon"></i>
                    </button>
                </div>
            </div>

            <div class="checkbox-group">
                <div class="checkbox-wrapper">
                    <input type="checkbox" id="remember-me" class="checkbox-input">
                    <div class="checkbox-custom"></div>
                </div>
                <label for="remember-me" class="checkbox-label">Remember me</label>
            </div>

            <button type="submit" class="auth-btn" id="login-btn">
                <span id="login-btn-text">Sign In</span>
            </button>
        </form>

        <!-- Auth Links -->
        <div class="auth-links">
            <p class="auth-link">
                Don't have an account?
                <a href="/register">Create one here</a>
            </p>
        </div>
    </div>
</div>
{% endblock %}
